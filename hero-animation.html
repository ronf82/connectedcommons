:root{
  --ink:#242423;--graphite:#333533;--sage:#CFDBD5;--mist:#E8EDDF;--yellow:#F5CB5C;--sage-deep:#5B6B5F;
  --surface:var(--ink);--surface-raised:var(--graphite);--text:var(--mist);--text-muted:var(--sage);
  --accent:var(--yellow);--on-accent:var(--ink);--border:var(--sage-deep);
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
/* The hero is a dark brand section in every viewer theme. */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:var(--ink)}}
:root[data-theme="dark"]{--surface:var(--ink)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--surface)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--surface);color:var(--text);font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.hero{min-height:100%;display:flex;align-items:center;padding:clamp(48px,8vw,96px) 24px}
.hero-inner{width:100%;max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.12fr);gap:clamp(24px,4vw,56px);align-items:center}
.eyebrow{margin:0 0 12px;font-size:13px;line-height:1.4;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font-family:Aqua,Figtree,system-ui,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(38px,4.6vw,64px);line-height:1.05;letter-spacing:.005em;text-wrap:balance}
h1 mark{background:var(--accent);color:var(--on-accent);border-radius:8px;padding:0 .14em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sub{margin:24px 0 0;max-width:30ch;font-size:clamp(17px,1.5vw,19px);line-height:1.6;color:var(--text-muted)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font:700 15px/1 Figtree,system-ui,sans-serif;text-decoration:none;transition:background-color .2s,border-color .2s,color .2s}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:#f8d77f}
.btn-secondary{color:var(--text);border:1.5px solid var(--sage)}
.btn-secondary:hover{border-color:var(--mist);background:rgba(232,237,223,.06)}
.btn:focus-visible,.replay:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.stage{position:relative;width:100%;aspect-ratio:10/9;overflow:hidden;
  background:radial-gradient(60% 55% at 52% 52%,#2b2c2a 0%,var(--ink) 100%)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#map{-webkit-mask-image:radial-gradient(ellipse 62% 60% at 52% 52%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 62% 60% at 52% 52%,#000 62%,transparent 100%)}
.cards{position:absolute;inset:0;perspective:700px;pointer-events:none}
.card{position:absolute;left:0;top:0;opacity:0;transform-origin:50% 100%;
  transform:translate3d(var(--x),calc(var(--y) + 10px),0) rotateX(-40deg);
  transition:opacity .45s ease,transform .6s cubic-bezier(.2,.9,.25,1.15)}
.card.in{opacity:1;transform:translate3d(var(--x),var(--y),0) rotateX(0)}
.card-flip{position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.card.flipped .card-flip{transform:rotateX(180deg)}
.face{border-radius:14px;padding:10px 12px 11px;background:var(--graphite);border:1px solid rgba(232,237,223,.12);
  box-shadow:0 14px 28px -10px rgba(0,0,0,.55),0 2px 0 rgba(232,237,223,.04) inset;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{position:absolute;inset:0;transform:rotateX(180deg)}
.meta{display:flex;align-items:center;gap:6px;font-size:var(--meta-size,11.5px);font-weight:500;color:var(--sage);opacity:.85;line-height:1.3}
.meta svg{width:1.15em;height:1.15em}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:5px}
.task{font-size:var(--task-size,14px);font-weight:650;line-height:1.25;color:var(--mist)}
.chip{flex:none;display:grid;place-items:center;width:var(--chip,26px);height:var(--chip,26px);border-radius:8px;background:rgba(207,219,213,.09);color:var(--sage);transition:opacity .15s}
.chip svg{width:62%;height:62%}
.card.eaten .chip svg{opacity:0}
.row.done{justify-content:flex-start;gap:8px}
.tick{flex:none;display:grid;place-items:center;width:var(--chip,26px);height:var(--chip,26px);border-radius:50%;background:rgba(207,219,213,.14);color:var(--mist)}
.tick svg{width:58%;height:58%}
.cards svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.replay{position:absolute;right:14px;bottom:12px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:0;border-radius:999px;
  background:rgba(36,36,35,.6);color:var(--sage);font:500 12px/1 Figtree,system-ui,sans-serif;cursor:pointer;opacity:0;transition:opacity .4s,color .2s}
.replay svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.replay.show{opacity:1}
.replay:hover{color:var(--mist)}

@media (max-width:860px){
  .hero{padding-top:40px}
  .hero-inner{grid-template-columns:1fr;gap:36px}
  .sub{max-width:36ch}
  .replay{display:none}
}

/* embedded: stage fills the frame, plays once with no replay */
html,body{height:100%;overflow:hidden}
.stage{height:100%;aspect-ratio:auto}
.replay{display:none!important}
</style>
</head>

/* ---------- maths ---------- */
const D2R = Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,d)=>clamp((t-a)/d,0,1);
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

/* dots -> unit-sphere trig tables */
const raw = Uint8Array.from(atob(DOTS_B64), c=>c.charCodeAt(0));
const i16 = new Int16Array(raw.buffer);
const N = i16.length/2;
const cLat=new Float32Array(N), sLat=new Float32Array(N), cLon=new Float32Array(N), sLon=new Float32Array(N), keep=new Float32Array(N);
for(let i=0;i<N;i++){
  const la=i16[2*i]/100*D2R, lo=i16[2*i+1]/100*D2R;
  cLat[i]=Math.cos(la); sLat[i]=Math.sin(la); cLon[i]=Math.cos(lo); sLon[i]=Math.sin(lo);
  keep[i]=((Math.sin(i*12.9898)*43758.5453)%1+1)%1; // stable pseudo-random for thinning
}

/* camera: centre lon/lat, pitch, distance (in globe radii from surface) */
const CAM0={lon:34, lat:18, pitch:0, dist:3.7};
const CAM1={lon:110.6, lat:4.2, pitch:36, dist:1.02};
function camAt(t){
  const p=prog(t,T.dive[0],T.dive[1]-T.dive[0]);
  const e=easeInOut(p);
  return {
    lon:lerp(CAM0.lon,CAM1.lon,easeInOut(Math.min(1,p*1.15))),
    lat:lerp(CAM0.lat,CAM1.lat,e),
    pitch:lerp(CAM0.pitch,CAM1.pitch,smooth(.35,1,p)),
    dist:Math.exp(lerp(Math.log(CAM0.dist),Math.log(CAM1.dist),e)),
    p
  };
}

function project(cam,cl,sl,co,so){
  // rotate so cam centre faces viewer
  const c0=Math.cos(cam.lon*D2R), s0=Math.sin(cam.lon*D2R);
  const ca=Math.cos(cam.lat*D2R), sa=Math.sin(cam.lat*D2R);
  const cph=Math.cos(cam.pitch*D2R), sph=Math.sin(cam.pitch*D2R);
  const cosd=co*c0+so*s0, sind=so*c0-co*s0;
  const x=cl*sind, y0=sl, z0=cl*cosd;
  const y=y0*ca-z0*sa, z=y0*sa+z0*ca;
  const vz=z-1;
  const qy=y*cph+vz*sph, qz=-y*sph+vz*cph;
  const depth=cam.dist-qz;
  const vis=(-cam.dist*sph*y+(1+cam.dist*cph)*z);
  return {x:CX+F*x/depth, y:CY-F*qy/depth, depth, vis};
}
function projLL(cam,lon,lat){
  return project(cam,Math.cos(lat*D2R),Math.sin(lat*D2R),Math.cos(lon*D2R),Math.sin(lon*D2R));
}

let finalCam, hubPt, cityPts=[], activeCities=[];

function layout(){
  const r=stage.getBoundingClientRect();
  W=r.width; H=r.height; DPR=Math.min(2,window.devicePixelRatio||1);
  [mapC,fxC].forEach(c=>{c.width=Math.round(W*DPR); c.height=Math.round(H*DPR);});
  compact = W<460;
  F=W*(compact?1.72:1.72); CX=W*0.5; CY=H*(compact?0.5:0.555);
  finalCam=camAt(T.dive[1]);
  hubPt=projLL(finalCam,HUB.lon,HUB.lat);
  activeCities=CITIES.filter(c=>!compact||c.compact);
  CITIES.forEach(c=>{c.el.style.display=activeCities.includes(c)?"":"none";});

  const cw=Math.round(clamp(W*(compact?0.37:0.3),118,196));
  stage.style.setProperty("--task-size",(compact?12:Math.min(14,W/42))+"px");
  stage.style.setProperty("--meta-size",(compact?10:Math.min(11.5,W/52))+"px");
  stage.style.setProperty("--chip",(compact?20:24)+"px");
  const g=compact?10:14, pad=8;
  activeCities.forEach(c=>{
    const p=projLL(finalCam,c.lon,c.lat); c.pt=p;
    const el=c.el; el.style.width=cw+"px";
    const ch=el.offsetHeight||56;
    let x,y;
    switch(c.place){
      case "left":   x=p.x-g-cw;        y=p.y-ch-4; break;
      case "upleft": x=p.x-cw*0.72;     y=p.y-g-ch; break;
      case "up":     x=p.x-cw*0.5;      y=p.y-g-ch; break;
      case "down":   x=p.x-cw*0.42;     y=p.y+g; break;
    }
    // keep clear of the logo that forms at Singapore
    const RL=clamp(W*0.032,12,22)*1.45, lg={x0:hubPt.x-RL*1.35,x1:hubPt.x+RL*2.2,y0:hubPt.y-RL*1.35,y1:hubPt.y+RL*1.35};
    const hit=()=>x<lg.x1&&x+cw>lg.x0&&y<lg.y1&&y+ch>lg.y0;
    if(hit()){ if(c.place==="down") y=lg.y1+6; else if(c.place==="left") x=lg.x0-cw-6; else y=lg.y0-ch-6; }
    x=clamp(x,pad,W-cw-pad); y=clamp(y,pad,H-ch-pad);
    c.box={x,y,w:cw,h:ch};
    el.style.setProperty("--x",x+"px"); el.style.setProperty("--y",y+"px");
    // arc from hub to city, lifted
    const mx=(hubPt.x+p.x)/2, my=(hubPt.y+p.y)/2, len=Math.hypot(p.x-hubPt.x,p.y-hubPt.y);
    c.ctrl={x:mx, y:my-len*0.32};
    // clock chip centre (front face, right side)
    const chip=compact?20:24;
    c.chipPt={x:x+cw-12-chip/2, y:y+ch-11-chip/2};
  });
}

/* ---------- drawing ---------- */
function bez(a,c,b,t){const u=1-t;return {x:u*u*a.x+2*u*t*c.x+t*t*b.x, y:u*u*a.y+2*u*t*c.y+t*t*b.y};}

function drawMap(t){
  const ctx=mctx; ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  const cam=camAt(t);
  const zoom=cam.p;
  const dim=1-0.28*prog(t,T.ringStart,700);

  // globe disc while far away
  const discA=1-smooth(.3,.72,zoom);
  if(discA>0.01){
    const Dc=cam.dist+1; const rad=F/Math.sqrt(Dc*Dc-1);
    const g=ctx.createRadialGradient(CX-rad*.35,CY-rad*.4,rad*.05,CX,CY,rad);
    g.addColorStop(0,"rgba(70,72,67,"+(0.75*discA)+")");
    g.addColorStop(1,"rgba(48,50,47,"+(0.7*discA)+")");
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(CX,CY,rad,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle="rgba(207,219,213,"+(0.18*discA)+")"; ctx.lineWidth=1; ctx.stroke();
  }

  const c0=Math.cos(cam.lon*D2R), s0=Math.sin(cam.lon*D2R);
  const ca=Math.cos(cam.lat*D2R), sa=Math.sin(cam.lat*D2R);
  const cph=Math.cos(cam.pitch*D2R), sph=Math.sin(cam.pitch*D2R);
  const d=cam.dist, camY=-d*sph, camZ=1+d*cph, camLen=Math.hypot(camY,camZ);
  const fineDensity=Math.exp(lerp(Math.log(.06),0,smooth(.28,.85,zoom)));
  const coarseFade=1-0.6*smooth(.55,1,zoom);
  const far=1-smooth(.2,.7,zoom);
  const B=[new Path2D(),new Path2D(),new Path2D(),new Path2D()];
  const sizeK=F*0.0026;
  for(let i=0;i<N;i++){
    const fine=i>=COARSE;
    if(fine && keep[i]>fineDensity) continue;
    const cosd=cLon[i]*c0+sLon[i]*s0, sind=sLon[i]*c0-cLon[i]*s0;
    const x=cLat[i]*sind, y0=sLat[i], z0=cLat[i]*cosd;
    const y=y0*ca-z0*sa, z=y0*sa+z0*ca;
    const facing=camY*y+camZ*z-1;
    if(facing<=0) continue;
    const vz=z-1, qy=y*cph+vz*sph, qz=-y*sph+vz*cph, depth=d-qz;
    if(depth<0.05) continue;
    const sx=CX+F*x/depth, sy=CY-F*qy/depth;
    if(sx<-4||sx>W+4||sy<-4||sy>H+4) continue;
    let a=clamp(facing/((camLen-1)*0.35),0,1);
    if(!fine) a*=coarseFade;
    // fade far (top) of tilted plane
    a*=clamp(1.25-depth/(d*1.35),0.35,1);
    const r=clamp(sizeK/depth*(fine?1:1+0.9*far),0.55+0.5*far,2.1);
    a=Math.min(1,a*(1+0.6*far));
    const b=Math.min(3,Math.floor(a*4));
    if(a<0.06) continue;
    B[b].moveTo(sx+r,sy); B[b].arc(sx,sy,r,0,Math.PI*2);
  }
  const alphas=[.16,.3,.44,.58];
  for(let b=0;b<4;b++){ctx.fillStyle=`rgba(207,219,213,${alphas[b]*dim})`; ctx.fill(B[b]);}

  if(t<T.dive[1]) return;
  // arcs, leaders, city dots
  activeCities.forEach((c,i)=>{
    const ap=easeOut(prog(t,T.arcStart+i*T.arcStep,T.arcDur));
    if(ap<=0) return;
    const len=Math.hypot(c.pt.x-hubPt.x,c.pt.y-hubPt.y)*1.15;
    const n=Math.max(8,Math.round(len/7));
    ctx.fillStyle=`rgba(232,237,223,${0.55*dim})`;
    ctx.beginPath();
    for(let k=1;k<=n;k++){
      const tt=k/n; if(tt>ap) break;
      const q=bez(hubPt,c.ctrl,c.pt,tt);
      ctx.moveTo(q.x+1.25,q.y); ctx.arc(q.x,q.y,1.25,0,Math.PI*2);
    }
    ctx.fill();
    if(ap>=1){
      // city dot
      ctx.fillStyle=`rgba(232,237,223,${0.95*dim})`;
      ctx.beginPath(); ctx.arc(c.pt.x,c.pt.y,3.2,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle=`rgba(232,237,223,${0.25*dim})`; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(c.pt.x,c.pt.y,7,0,Math.PI*2); ctx.stroke();
      // leader to card
      const lp=prog(t,T.arcStart+i*T.arcStep+T.arcDur,250);
      if(lp>0){
        const bx=clamp(c.pt.x,c.box.x+10,c.box.x+c.box.w-10), by=clamp(c.pt.y,c.box.y,c.box.y+c.box.h);
        const ex=c.pt.x+(bx-c.pt.x)*lp, ey=c.pt.y+(by-c.pt.y)*lp;
        const dx=ex-c.pt.x, dy=ey-c.pt.y, L=Math.hypot(dx,dy);
        if(L>8){
          ctx.strokeStyle=`rgba(207,219,213,${0.35*dim})`; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(c.pt.x+dx/L*7,c.pt.y+dy/L*7); ctx.lineTo(ex,ey); ctx.stroke();
        }
      }
    }
  });
}

function drawC(ctx,x,y,R,theta,mouth,alpha){
  const m=mouth*D2R;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.lineWidth=R*0.25; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#F5CB5C";
  const vx=x-Math.cos(theta)*R*0.035, vy=y-Math.sin(theta)*R*0.035;
  ctx.beginPath();
  ctx.moveTo(vx,vy);
  ctx.lineTo(x+Math.cos(theta+m)*R, y+Math.sin(theta+m)*R);
  ctx.arc(x,y,R,theta+m,theta+Math.PI*2-m,false);
  ctx.lineTo(vx,vy);
  ctx.stroke(); ctx.restore();
}
function drawClock(ctx,x,y,s,alpha){
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle="#333533"; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#E8EDDF"; ctx.lineWidth=1.8; ctx.lineCap="round";
  ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,-4); ctx.lineTo(0,0); ctx.lineTo(2.6,1.7); ctx.stroke();
  ctx.restore();
}
function angLerp(a,b,t){let d=((b-a+Math.PI*3)%(Math.PI*2))-Math.PI;return a+d*t;}

function drawFx(t){
  const ctx=fctx; ctx.setTransform(DPR,0,0,DPR,0,0); ctx.clearRect(0,0,W,H);
  if(t<T.hubIn-200) return;
  const R0=clamp(W*0.032,12,22);
  const hx=hubPt.x, hy=hubPt.y;

  // hub pulse (before logo forms)
  const pulseOn=t>=T.hubIn-200 && t<T.ringStart+300;
  if(pulseOn){
    const fade=1-prog(t,T.ringStart-100,400);
    for(let k=0;k<2;k++){
      const ph=(((t-T.hubIn)/1600)+k*0.5)%1;
      if(t<T.hubIn && k>0) continue;
      ctx.strokeStyle=`rgba(245,203,92,${(1-ph)*0.45*fade})`; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(hx,hy,R0*(1+ph*1.9),0,Math.PI*2); ctx.stroke();
    }
  }

  // C state
  const appear=easeOutBack(prog(t,T.hubIn,520));
  let theta=0, mouth=24;
  const ring=easeInOut(prog(t,T.ringStart,800));
  const scale=lerp(1,1.45,ring);
  const R=R0*scale*appear;

  // incoming clocks
  const flying=[];
  activeCities.forEach((c,i)=>{
    const t0=T.eatStart+i*T.eatStep;
    const fp=prog(t,t0,T.fly);
    c.el.classList.toggle("eaten",t>=t0);
    c.el.classList.toggle("flipped",t>=t0+120);
    if(t>=t0 && fp<1){
      const e=easeInOut(fp);
      const a=bez(c.chipPt,{x:(c.chipPt.x+c.ctrl.x)/2,y:Math.min(c.chipPt.y,c.ctrl.y)-10},{x:hx,y:hy},e);
      flying.push({x:a.x,y:a.y,p:fp,i});
    }
  });
  // facing + mouth from the active/next clock
  let target=null;
  for(let i=0;i<activeCities.length;i++){
    const t0=T.eatStart+i*T.eatStep;
    if(t<t0+T.fly+180){target={i,t0};break;}
  }
  if(target && t>=target.t0-260 && t<T.ringStart){
    const c=activeCities[target.i];
    const want=Math.atan2(c.ctrl.y-hy,c.ctrl.x-hx);
    const prevWant=target.i>0?Math.atan2(activeCities[target.i-1].ctrl.y-hy,activeCities[target.i-1].ctrl.x-hx):0;
    theta=angLerp(prevWant,want,easeInOut(prog(t,target.t0-260,300)));
    const arrive=target.t0+T.fly;
    if(t<arrive){ mouth=lerp(24,52,easeOut(prog(t,target.t0,T.fly*0.8))); }
    else { const k=prog(t,arrive,170); mouth = k<0.45? lerp(52,3,k/0.45) : lerp(3,24,(k-0.45)/0.55); }
  } else if(t>=T.ringStart-400){
    const last=activeCities.length-1;
    const lw=Math.atan2(activeCities[last].ctrl.y-hy,activeCities[last].ctrl.x-hx);
    theta=angLerp(lw,0,easeInOut(prog(t,T.ringStart-400,600)));
  }

  // logo ring (behind C)
  if(ring>0){
    const rx=hx+0.83*R, ry=hy;
    ctx.save(); ctx.strokeStyle="#E8EDDF"; ctx.lineWidth=R*0.25; ctx.lineCap="round";
    ctx.beginPath(); ctx.arc(rx,ry,R,-Math.PI/2,-Math.PI/2+Math.PI*2*ring); ctx.stroke(); ctx.restore();
  }
  if(R>0.5){
    // soft dark halo so the mark reads over arcs
    ctx.save(); ctx.fillStyle="rgba(36,36,35,.55)"; ctx.beginPath(); ctx.arc(hx,hy,R*1.2,0,Math.PI*2); ctx.fill(); ctx.restore();
    drawC(ctx,hx,hy,R,theta,mouth,clamp(appear*1.4,0,1));
  }
  flying.forEach(f=>{
    const s=lerp(1,0.55,easeInOut(f.p))*(R0/16);
    const a=f.p>0.85?1-(f.p-0.85)/0.15:1;
    drawClock(ctx,f.x,f.y,s*0.85,a);
  });
}

/* ---------- loop ---------- */
let start=0, raf=0, done=false;
function setCardsIn(t){
  activeCities.forEach((c,i)=>{
    c.el.classList.toggle("in", t>=T.arcStart+i*T.arcStep+T.arcDur-60);
  });
}
function frame(now){
  const t=now-start;
  setCardsIn(t);
  drawMap(t); drawFx(t);
  if(t<T.end){ raf=requestAnimationFrame(frame); }
  else { done=true; renderFinal(); replayBtn.classList.add("show"); replayBtn.tabIndex=0; }
}
function renderFinal(){
  const t=T.end+2000;
  stage.classList.add("static");
  activeCities.forEach(c=>{c.el.style.transition="none"; c.el.querySelector(".card-flip").style.transition="none";});
  setCardsIn(t); drawMap(t); drawFx(t);
  void stage.offsetWidth;
  activeCities.forEach(c=>{c.el.style.transition=""; c.el.querySelector(".card-flip").style.transition="";});
}
function play(){
  cancelAnimationFrame(raf); done=false;
  replayBtn.classList.remove("show"); replayBtn.tabIndex=-1;
  CITIES.forEach(c=>{c.el.style.transition="none";c.el.querySelector(".card-flip").style.transition="none";c.el.classList.remove("in","flipped","eaten");});
  void stage.offsetWidth;
  CITIES.forEach(c=>{c.el.style.transition="";c.el.querySelector(".card-flip").style.transition="";});
  start=performance.now(); raf=requestAnimationFrame(frame);
}
const stillOnly=()=>reduce.matches||mobileQ.matches;
function boot(){
  layout();
  if(stillOnly()){ done=true; renderFinal(); }
  else play();
}
replayBtn.addEventListener("click",play);
let rt=0;
window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{layout(); if(done||stillOnly()){cancelAnimationFrame(raf);done=true;renderFinal();}},120);});
// expose for recording / preview
window.ccHero={play,renderAt:(t)=>{cancelAnimationFrame(raf);layout();setCardsIn(t);drawMap(t);drawFx(t);},T};
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(boot);
})();
</script>
